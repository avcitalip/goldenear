name: Build Altin Kulak APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: unzip -o AltinKulak-Android-Studio.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: AltinKulak-Android-Studio
        run: gradle assembleDebug
      - name: Upload AltinKulak APK
        uses: actions/upload-artifact@v4
        with:
          name: AltinKulak-APK
          path: AltinKulak-Android-Studio/app/build/outputs/apk/debug/app-debug.apk
